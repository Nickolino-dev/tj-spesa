<style>
:root{
  --carta:#fbfcff;
  --quadretto:#dfe7f5;
  --margine:#e4473b;
  --inchiostro:#1d3787;
  --testo:#1a2440;
  --tenue:#6b7896;
  --basilico:#2f7d52;
  --superficie:#ffffff;
  --bordo:#cdd8ec;
  --ombra:0 1px 0 #cdd8ec, 0 8px 24px -12px rgba(29,55,135,.35);
  --q:26px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --carta:#14213f;
    --quadretto:#1f2f55;
    --margine:#ff6b5e;
    --inchiostro:#9db6ff;
    --testo:#e8edfb;
    --tenue:#95a3c6;
    --basilico:#6fd39b;
    --superficie:#1a2a4e;
    --bordo:#2c3e6a;
    --ombra:0 1px 0 #2c3e6a, 0 10px 28px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --carta:#14213f;--quadretto:#1f2f55;--margine:#ff6b5e;--inchiostro:#9db6ff;--testo:#e8edfb;
  --tenue:#95a3c6;--basilico:#6fd39b;--superficie:#1a2a4e;--bordo:#2c3e6a;
  --ombra:0 1px 0 #2c3e6a, 0 10px 28px -12px rgba(0,0,0,.6);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Figtree",system-ui,sans-serif;
  color:var(--testo);
  background-color:var(--carta);
  background-image:
    linear-gradient(var(--quadretto) 1px, transparent 1px),
    linear-gradient(90deg, var(--quadretto) 1px, transparent 1px);
  background-size:var(--q) var(--q);
  background-position:-1px -1px;
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}
/* la riga rossa del margine del quaderno */
body::before{
  content:"";position:fixed;top:0;bottom:0;left:calc(var(--q) * 2 - 1px);
  width:2px;background:var(--margine);opacity:.55;pointer-events:none;z-index:0;
}
.foglio{
  position:relative;z-index:1;
  max-width:560px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 18px) 16px calc(120px + env(safe-area-inset-bottom)) calc(var(--q) * 2 + 14px);
}

/* ---------- testata ---------- */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:6px}
h1{
  font-family:"Caveat",cursive;font-weight:700;
  font-size:clamp(52px,15vw,68px);line-height:.9;
  color:var(--inchiostro);letter-spacing:-.5px;
  transform:rotate(-2deg);transform-origin:left bottom;
}
.stato{
  display:flex;align-items:center;gap:6px;font-size:13px;color:var(--tenue);
  padding-bottom:8px;white-space:nowrap;
}
.stato i{width:8px;height:8px;border-radius:50%;background:var(--tenue);display:inline-block}
.stato.ok i{background:var(--basilico);box-shadow:0 0 0 3px color-mix(in srgb,var(--basilico) 25%,transparent)}
.stato.off i{background:var(--margine)}
.riepilogo{font-size:15px;color:var(--tenue);margin:4px 0 22px;min-height:20px}
.riepilogo b{color:var(--testo);font-weight:600}

.avviso{
  font-size:14px;line-height:1.45;background:var(--superficie);border:1px dashed var(--bordo);
  border-radius:10px;padding:10px 12px;margin-bottom:18px;color:var(--tenue)
}
.avviso[hidden]{display:none}

/* ---------- reparti ---------- */
.reparto{margin-bottom:22px}
.reparto h2{
  font-family:"Caveat",cursive;font-weight:700;font-size:28px;line-height:var(--q);
  color:var(--inchiostro);margin-bottom:4px;display:flex;align-items:center;gap:8px;
}
.reparto h2 .em{font-size:20px;line-height:1}
ul{list-style:none}

.voce{
  display:flex;align-items:center;gap:12px;
  min-height:52px;padding:6px 6px 6px 10px;margin-bottom:6px;
  background:var(--superficie);border-radius:12px;box-shadow:var(--ombra);
  animation:entra .28s ease-out;
}
@keyframes entra{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.spunta{
  flex:none;width:28px;height:28px;border-radius:50%;
  border:2px solid var(--inchiostro);background:transparent;cursor:pointer;
  display:grid;place-items:center;transition:background .15s, border-color .15s;
}
.spunta svg{width:16px;height:16px;stroke:#fff;stroke-width:3;fill:none;opacity:0;transition:opacity .15s}
.corpo{flex:1;min-width:0;cursor:pointer;padding:4px 0}
.nome{
  position:relative;display:inline;font-size:18px;font-weight:500;line-height:1.3;
  word-break:break-word;
}
.nome::after{
  content:"";position:absolute;left:-3px;right:-3px;top:55%;height:2.5px;
  background:var(--inchiostro);border-radius:2px;
  transform:scaleX(0) rotate(-1.5deg);transform-origin:left center;
  transition:transform .32s cubic-bezier(.6,.05,.3,1);
}
.chi{display:block;font-size:12.5px;color:var(--tenue);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.togli{
  flex:none;width:36px;height:40px;border:0;background:transparent;border-radius:10px;
  color:var(--tenue);font-size:22px;line-height:1;cursor:pointer;
}
.togli:active{background:color-mix(in srgb,var(--margine) 12%,transparent);color:var(--margine)}

/* fatto */
.voce.fatto{background:transparent;box-shadow:none;border:1px dashed var(--bordo)}
.voce.fatto .spunta{background:var(--basilico);border-color:var(--basilico)}
.voce.fatto .spunta svg{opacity:1}
.voce.fatto .nome{color:var(--tenue)}
.voce.fatto .nome::after{transform:scaleX(1) rotate(-1.5deg);background:var(--tenue)}

.carrello-testa{display:flex;align-items:center;justify-content:space-between;margin-top:30px}
.carrello-testa h2{margin:0}
.svuota{
  border:0;background:transparent;color:var(--margine);font:600 15px "Figtree",sans-serif;
  padding:10px 8px;cursor:pointer;border-radius:8px;white-space:nowrap;flex:none;
}
.carrello-testa h2{flex:1;min-width:0}
.vuoto{text-align:center;padding:40px 10px 20px;color:var(--tenue)}
.vuoto p:first-child{font-family:"Caveat",cursive;font-size:34px;color:var(--inchiostro);margin-bottom:6px}

/* ---------- barra aggiungi ---------- */
.barra{
  position:fixed;left:0;right:0;bottom:0;z-index:5;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--carta) 70%, transparent);
}
.barra form{
  max-width:560px;margin:0 auto;display:flex;gap:8px;
  background:var(--superficie);border:2px solid var(--inchiostro);border-radius:16px;
  padding:5px 5px 5px 14px;box-shadow:0 10px 30px -14px rgba(29,55,135,.6);
}
.barra input{
  flex:1;min-width:0;border:0;background:transparent;outline:none;
  font:500 18px "Figtree",sans-serif;color:var(--testo);
}
.barra input::placeholder{color:var(--tenue);font-weight:400}
.aggiungi{
  flex:none;width:48px;height:48px;border:0;border-radius:12px;
  background:var(--inchiostro);color:var(--carta);font-size:30px;line-height:1;cursor:pointer;
}
.aggiungi:active{transform:scale(.94)}
.suggerimento{max-width:560px;margin:6px auto 0;font-size:13px;color:var(--tenue);min-height:18px;padding-left:4px}
.proposte{
  max-width:560px;margin:0 auto 8px;background:var(--superficie);border:1px solid var(--bordo);
  border-radius:14px;box-shadow:var(--ombra);overflow:hidden;
}
.proposte[hidden]{display:none}
.proposta{
  display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:6px 14px;
  border:0;background:transparent;color:var(--testo);text-align:left;cursor:pointer;
  font:500 17px "Figtree",sans-serif;
}
.proposta + .proposta{border-top:1px solid var(--bordo)}
.proposta:active{background:color-mix(in srgb,var(--inchiostro) 10%,transparent)}
.proposta .pe{font-size:24px;width:30px;text-align:center;flex:none}
.proposta .pn{flex:1;min-width:0}
.proposta .pn b{font-weight:700;color:var(--inchiostro)}
.proposta .pr{font-size:12.5px;color:var(--tenue);white-space:nowrap}
.proposta.gia .pr{color:var(--basilico);font-weight:600}
.icona{flex:none;font-size:26px;width:32px;text-align:center;line-height:1}
.qta{
  display:inline-block;vertical-align:2px;margin-left:8px;padding:2px 9px;border-radius:999px;
  font-size:13px;font-weight:700;color:var(--inchiostro);
  background:color-mix(in srgb,var(--inchiostro) 13%,transparent);white-space:nowrap;
}
.voce.fatto .qta{color:var(--tenue);background:transparent;border:1px solid var(--bordo)}
.frequenti{margin:0 0 22px}
.frequenti h2{font-family:"Caveat",cursive;font-weight:700;font-size:24px;color:var(--inchiostro);margin-bottom:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-right:-16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;display:flex;align-items:center;gap:6px;min-height:42px;padding:6px 14px 6px 10px;
  border:1px solid var(--bordo);border-radius:999px;background:var(--superficie);color:var(--testo);
  font:500 15px "Figtree",sans-serif;cursor:pointer;white-space:nowrap;box-shadow:var(--ombra);
}
.chip span{font-size:20px;line-height:1}
.chip:active{transform:scale(.96)}
.voce.fatto .icona{opacity:.45;filter:grayscale(.6)}
.voce.fatto .chi{white-space:normal}
header h1{white-space:nowrap;min-width:0}

/* ---------- foglio nome ---------- */
.velo{position:fixed;inset:0;z-index:20;background:rgba(20,33,63,.45);display:grid;place-items:end center}
.velo[hidden]{display:none}
.scheda{
  width:100%;max-width:560px;background:var(--carta);border-radius:22px 22px 0 0;
  padding:26px 20px calc(24px + env(safe-area-inset-bottom));
  animation:sale .3s ease-out;
}
@keyframes sale{from{transform:translateY(100%)}to{transform:none}}
.scheda h3{font-family:"Caveat",cursive;font-size:38px;color:var(--inchiostro);line-height:1}
.scheda p{color:var(--tenue);margin:8px 0 16px;line-height:1.45}
.scheda input{
  width:100%;font:500 18px "Figtree",sans-serif;padding:14px;border-radius:12px;
  border:2px solid var(--bordo);background:var(--superficie);color:var(--testo);outline:none;
}
.scheda input:focus{border-color:var(--inchiostro)}
.scheda button{
  margin-top:12px;width:100%;padding:15px;border:0;border-radius:12px;
  background:var(--inchiostro);color:var(--carta);font:600 17px "Figtree",sans-serif;cursor:pointer;
}
.scheda label{display:block;font-size:14px;font-weight:600;color:var(--tenue);margin-top:14px}
.scheda label input,.scheda label select{margin-top:6px}
.scheda select{
  width:100%;font:500 17px "Figtree",sans-serif;padding:13px 12px;border-radius:12px;
  border:2px solid var(--bordo);background:var(--superficie);color:var(--testo);outline:none;
}
.scheda select:focus{border-color:var(--inchiostro)}
.scheda .azioni{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;margin-top:8px}
.scheda .azioni button{margin-top:12px}
.scheda button.secondario{background:transparent;color:var(--inchiostro);border:2px solid var(--bordo)}
.matita{
  flex:none;width:36px;height:40px;border:0;background:transparent;border-radius:10px;
  color:var(--tenue);cursor:pointer;display:grid;place-items:center;
}
.matita svg{width:19px;height:19px;stroke:currentColor;stroke-width:2;fill:none}
.matita:active{background:color-mix(in srgb,var(--inchiostro) 12%,transparent);color:var(--inchiostro)}
.chi-sono{
  border:0;background:transparent;color:var(--tenue);font:500 13px "Figtree",sans-serif;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 0;
}

/* toast */
.toast{
  position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));z-index:30;
  transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--testo);color:var(--carta);padding:10px 16px;border-radius:999px;font-size:14px;
  transition:opacity .2s, transform .2s;white-space:nowrap;
}
.toast.su{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:transparent;color:var(--basilico);font:700 14px "Figtree";margin-left:10px;cursor:pointer}

/* ---------- storico ---------- */
.testata-dx{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.apri-storico{
  display:flex;align-items:center;gap:6px;min-height:38px;padding:6px 13px 6px 10px;
  border:2px solid var(--inchiostro);border-radius:999px;background:var(--superficie);
  color:var(--inchiostro);font:600 14.5px "Figtree",sans-serif;cursor:pointer;box-shadow:var(--ombra);
}
.apri-storico span{font-size:17px;line-height:1}
.apri-storico:active{transform:scale(.96)}
body.in-storico .foglio-lista,body.in-storico .barra{display:none}
.storico[hidden]{display:none}
.indietro{
  border:0;background:transparent;color:var(--inchiostro);font:600 16px "Figtree",sans-serif;
  padding:8px 10px 8px 0;cursor:pointer;display:flex;align-items:center;gap:4px;margin-bottom:4px;
}
.indietro svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.4;fill:none}
.storico h1{margin-bottom:6px}
.sottotitolo{font-size:15px;color:var(--tenue);margin:6px 0 16px}
.cerca-storico{
  position:sticky;top:calc(env(safe-area-inset-top) + 8px);z-index:3;margin-bottom:20px;
  display:flex;align-items:center;gap:8px;background:var(--superficie);
  border:2px solid var(--inchiostro);border-radius:16px;padding:4px 6px 4px 14px;
  box-shadow:0 10px 30px -14px rgba(29,55,135,.6);
}
.cerca-storico svg{width:20px;height:20px;stroke:var(--tenue);stroke-width:2.2;fill:none;flex:none}
.cerca-storico input{
  flex:1;min-width:0;border:0;background:transparent;outline:none;padding:11px 0;
  font:500 18px "Figtree",sans-serif;color:var(--testo);
}
.cerca-storico input::placeholder{color:var(--tenue);font-weight:400}
.cerca-storico input::-webkit-search-cancel-button{display:none}
.pulisci{flex:none;width:36px;height:36px;border:0;border-radius:10px;background:transparent;color:var(--tenue);font-size:22px;cursor:pointer}
.pulisci[hidden]{display:none}
.acq{gap:10px;padding-right:12px}
.acq .corpo{cursor:default}
.ora{flex:none;font-size:13px;font-weight:600;color:var(--tenue);font-variant-numeric:tabular-nums}
.sp{
  background:var(--superficie);border-radius:14px;box-shadow:var(--ombra);
  padding:14px 14px 12px;margin-bottom:12px;animation:entra .28s ease-out;
}
.sp-testa{display:flex;align-items:center;gap:12px}
.sp-testa .corpo{cursor:default;padding:0}
.sp-nome{font-size:19px;font-weight:600;line-height:1.25;word-break:break-word}
.sp-ultimo{font-size:15px;margin-top:3px;line-height:1.35}
.sp-ultimo b{color:var(--inchiostro);font-weight:700}
.sp-volte{font-size:13px;color:var(--tenue);margin-top:2px}
.sp-date{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--bordo)}
.sp-date span{
  font-size:13px;padding:3px 9px;border-radius:999px;border:1px solid var(--bordo);
  color:var(--tenue);white-space:nowrap;font-variant-numeric:tabular-nums;
}
.rimetti{
  margin-top:12px;width:100%;min-height:44px;border:2px solid var(--bordo);border-radius:12px;
  background:transparent;color:var(--inchiostro);font:600 15px "Figtree",sans-serif;cursor:pointer;
}
.rimetti:active{background:color-mix(in srgb,var(--inchiostro) 10%,transparent)}
.rimetti[disabled]{color:var(--basilico);border-style:dashed;cursor:default}

:focus-visible{outline:3px solid var(--margine);outline-offset:2px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media (max-width:360px){ :root{--q:22px} }
</style>
</head>
<body>
<main class="foglio foglio-lista">
  <header>
    <h1>TJ Spesa</h1>
    <div class="testata-dx">
      <button class="apri-storico" id="apriStorico" type="button"><span aria-hidden="true">📒</span>Storico</button>
      <div class="stato" id="stato" role="status"><i></i><span>Connessione…</span></div>
    </div>
  </header>
  <p class="riepilogo" id="riepilogo"></p>
  <p class="avviso" id="avvisoDemo" hidden>
    Modalità prova: la lista resta solo su questo telefono. Per condividerla con la famiglia inserisci i dati di Firebase nel file.
  </p>
  <div id="lista"></div>
  <p style="margin-top:28px"><button class="chi-sono" id="cambiaNome"></button></p>
</main>

<section class="foglio storico" id="storico" hidden aria-label="Storico acquisti">
  <button class="indietro" id="chiudiStorico" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>Lista</button>
  <h1>Storico</h1>
  <p class="sottotitolo" id="riepilogoStorico"></p>
  <div class="cerca-storico">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5" stroke-linecap="round"/></svg>
    <input id="cercaStorico" type="search" enterkeyhint="search" placeholder="Quando ho preso il latte?" aria-label="Cerca nei prodotti acquistati" autocomplete="off">
    <button class="pulisci" id="pulisciStorico" type="button" aria-label="Cancella ricerca" hidden>×</button>
  </div>
  <div id="listaStorico"></div>
</section>

<div class="barra">
  <div class="proposte" id="proposte" hidden></div>
  <form id="form" autocomplete="off">
    <input id="campo" type="text" enterkeyhint="done" placeholder="Cerca o scrivi (es. 2 mozzarelle)" aria-label="Aggiungi alla lista" maxlength="80">
    <button class="aggiungi" type="submit" aria-label="Aggiungi">+</button>
  </form>
  <p class="suggerimento" id="sugg"></p>
</div>

<div class="velo" id="veloNome" hidden>
  <form class="scheda" id="formNome">
    <h3>Ciao! Chi sei?</h3>
    <p>Il tuo nome compare accanto alle cose che aggiungi, così gli altri sanno chi le ha chieste.</p>
    <input id="campoNome" type="text" placeholder="Il tuo nome" maxlength="20" required>
    <button type="submit">Inizia la lista</button>
  </form>
</div>

<div class="velo" id="veloModifica" hidden>
  <form class="scheda" id="formModifica" autocomplete="off">
    <h3>Modifica</h3>
    <label>Prodotto
      <input id="modNome" type="text" maxlength="70" required>
    </label>
    <label>Quantità
      <input id="modQta" type="text" maxlength="15" placeholder="es. 2, 1 kg, 3 conf">
    </label>
    <label>Reparto
      <select id="modReparto"></select>
    </label>
    <div class="azioni">
      <button type="button" class="secondario" id="modAnnulla">Annulla</button>

</div>

<div class="toast" id="toast" role="status"><span id="toastTesto"></span><button id="toastAnnulla" type="button">Annulla</button></div>

<script type="module">
import { CATALOGO } from "./catalogo.js";
/* ---------------- reparti e riconoscimento automatico ---------------- */
const REPARTI = [
  {id:"frutta",  nome:"Frutta e verdura", em:"🥬", parole:"mela mele pera pere banan arancia arance limon mandarin kiwi uva frag pesca pesche albicocc ciliegi melone anguria ananas avocado pomodor insalat lattuga rucola carot zucchin melanzan peperon patat cipoll aglio sedano finocch spinac cavol broccol funghi fagiolin basilico prezzemolo verdur frutta zucca porri radicchio"},
  {id:"carne",   nome:"Carne e pesce",    em:"🥩", parole:"carne pollo petto tacchino manzo maiale vitello macinato salsiccia salsicce hamburger bistecc fettin cotolett arrosto agnello coniglio pesce salmone merluzzo orata branzino gamber cozze vongole calamar polp"},
  {id:"latte",   nome:"Latte, uova e formaggi", em:"🧀", parole:"latte yogurt burro panna uova uovo formagg mozzarell parmigian grana pecorino ricotta stracchino mascarpone scamorza provola gorgonzola sottilett prosciutto cotto crudo salame mortadella bresaola speck affettat wurstel"},
  {id:"pane",    nome:"Pane e colazione", em:"🥐", parole:"pane panino panini piadin focacc grissin crackers cracker fette biscottate biscott cornett brioche merendin cereali muesli marmellat nutella miele caffè caffe tè the tisan cacao"},
  {id:"dispensa",nome:"Dispensa",         em:"🍝", parole:"pasta spaghetti penne fusilli riso farina zucchero sale olio aceto passata pelati sugo pesto tonno scatola legumi ceci fagioli lenticchie mais piselli lievito pangrattato spezie pepe origano dado brodo maionese ketchup senape cioccolat patatine snack"},
  {id:"bevande", nome:"Bevande",          em:"🥤", parole:"acqua vino birra succo succhi coca cola aranciata bibit spumante prosecco gassata naturale tonica"},
  {id:"surgelati",nome:"Surgelati",       em:"🧊", parole:"surgelat gelato gelati bastoncini pizza surgelata minestrone ghiaccio"},
  {id:"casa",    nome:"Casa e igiene",    em:"🧴", parole:"detersiv sapone shampoo balsamo bagnoschiuma dentifricio spazzolino carta igienica scottex tovaglioli fazzoletti spugn sacchetti pattumiera alluminio pellicola candeggina sgrassatore ammorbidente pastiglie lavastoviglie deodorante assorbenti pannolini cotton"},
  {id:"animali", nome:"Animali",          em:"🐾", parole:"crocchette cane gatto cani gatti lettiera bocconcini snack cane"},
  {id:"altro",   nome:"Altro",            em:"🛒", parole:""}
];
function indovinaReparto(testo){
  const t = " " + testo.toLowerCase() + " ";
  for (const r of REPARTI){
    if (!r.parole) continue;
    for (const p of r.parole.split(" ")) if (p && t.includes(p)) return r.id;
  }
  return "altro";
}

/* ---------------- stato locale ---------------- */
const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch{ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch{} }
};
let mioNome = store.get("spesa.nome") || "";
const idLista = (decodeURIComponent(location.hash.slice(1)) || CONFIG.listaPredefinita || "famiglia")
  .toLowerCase().replace(/[^a-z0-9\-_]/g,"-").slice(0,40) || "famiglia";
let voci = [];
let prodotti = [];   // prodotti ricordati dalla famiglia (nuovi + quante volte comprati)
let acquisti = [];   // storico: cosa è stato preso, da chi e quando
let statoAcq = "carica";

/* ---------------- catalogo e ricerca ---------------- */
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").trim();
const chiave = s => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) || "x";
const RE_QTA = /^(\d+(?:[.,]\d+)?\s*(?:kg|g|gr|hg|l|lt|ml|cl|pz|pezzi|conf|confezioni|x|vasetti|bottiglie|pacchi|pacco|scatole)?\.?)\s+(.+)$/i;
function separaQta(testo){
  const m = testo.match(RE_QTA);
  return m ? { qta: m[1].replace(/\s+/g, " "), resto: m[2] } : { qta: "", resto: testo };
}
const emReparto = id => (REPARTI.find(r => r.id === id) || REPARTI[REPARTI.length - 1]).em;
const nomeReparto = id => (REPARTI.find(r => r.id === id) || REPARTI[REPARTI.length - 1]).nome;

function indice(){
  const mappa = new Map();
  for (const c of CATALOGO) mappa.set(chiave(c.nome), { ...c, usi: 0 });
  for (const p of prodotti){
    const k = chiave(p.nome);
    if (!mappa.has(k) && (p.usi || 0) <= 0) continue;   // scritto male e poi corretto
    mappa.set(k, { ...(mappa.get(k) || {}), ...p, usi: p.usi || 0 });
  }
  return [...mappa.values()];
}
function cerca(testo, max = 5){
  const q = norm(testo);
  if (!q) return [];
  const risultati = [];
  for (const p of indice()){
    const n = norm(p.nome);
    let punti = 0;
    if (n === q) punti = 100;
    else if (n.startsWith(q)) punti = 80;
    else if (n.split(" ").some(w => w.startsWith(q))) punti = 60;
    else if (q.length >= 3 && n.includes(q)) punti = 30;
    if (punti) risultati.push({ ...p, punti: punti + Math.min(p.usi || 0, 15) });
  }
  return risultati.sort((a, b) => b.punti - a.punti || a.nome.length - b.nome.length).slice(0, max);
}
function giaInLista(nome){ return voci.some(v => !v.fatto && chiave(separaQta(v.nome).resto) === chiave(nome)); }
function trovaEsatto(testo){
  const k = chiave(testo);
  return indice().find(p => chiave(p.nome) === k) || null;
}
// riconosce il prodotto anche se scritto diverso (es. "Panini imbustati" -> Panini)
function riconosci(testo){
  const { resto } = separaQta(testo);
  const esatto = trovaEsatto(resto);
  if (esatto) return esatto;
  const parole = norm(resto).split(" ").filter(w => w.length >= 3);
  for (const w of parole){
    const top = cerca(w, 1)[0];
    if (top && top.punti >= 60) return top;
  }
  return null;
}
// icona e reparto di una voce: quelli salvati, altrimenti riconosciuti dal nome
function aspetto(v){
  if (v.em) return { em: v.em, reparto: v.reparto || "altro" };
  const p = riconosci(v.nome);
  if (p) return { em: p.em, reparto: p.reparto };
  return { em: emReparto(v.reparto), reparto: v.reparto || "altro" };
}

/* ---------------- backend: Firebase o prova locale ---------------- */
let api;
const usaFirebase = !!(CONFIG.firebase && CONFIG.firebase.apiKey);

function stato(tipo, testo){
  const s = $("stato"); s.className = "stato " + tipo; s.querySelector("span").textContent = testo;
}

async function avviaFirebase(){
  const V = "10.12.2";
  const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const fs = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const au = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
  const app = initializeApp(CONFIG.firebase);
  const db = fs.initializeFirestore(app, { localCache: fs.persistentLocalCache() });
  await au.signInAnonymously(au.getAuth(app));
  const col = fs.collection(db, "liste", idLista, "articoli");

  fs.onSnapshot(col, { includeMetadataChanges: true }, snap => {
    voci = snap.docs.map(d => ({ id:d.id, ...d.data(), creato: d.data().creato?.toMillis?.() ?? Date.now() }));
    if (!snap.metadata.fromCache) stato("ok", "Sincronizzata");
    else if (!navigator.onLine) stato("off", "Offline");
    else stato("", "Collegamento…");
    disegna();
  }, err => { stato("off", "Errore di connessione"); console.error(err); });

  const colProd = fs.collection(db, "liste", idLista, "prodotti");
  fs.onSnapshot(colProd, snap => {
    prodotti = snap.docs.map(d => d.data());
    aggiornaProposte(); disegna();
  }, err => console.error(err));

  // storico acquisti: un documento per ogni prodotto spuntato (stesso id della voce)
  const colAcq = fs.collection(db, "liste", idLista, "acquisti");
  let ascoltoAcq = null;

  return {
    registraAcquisto: (id, a) => fs.setDoc(fs.doc(colAcq, id), a),
    annullaAcquisto: id => fs.deleteDoc(fs.doc(colAcq, id)),
    aggiornaAcquisto: (id, c) => fs.updateDoc(fs.doc(colAcq, id), c),
    ascoltaAcquisti(){
      if (ascoltoAcq) return;
      ascoltoAcq = fs.onSnapshot(fs.query(colAcq, fs.orderBy("il", "desc"), fs.limit(2000)), snap => {
        acquisti = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        statoAcq = "ok"; recuperaAcquisti(); disegnaStorico();
      }, err => { statoAcq = "errore"; console.error(err); disegnaStorico(); });
    },
    dimenticaProdotto: nome => fs.updateDoc(fs.doc(colProd, chiave(nome)), { usi: fs.increment(-1) }),
    registraProdotto: p => fs.setDoc(fs.doc(colProd, chiave(p.nome)),
      { nome: p.nome, em: p.em, reparto: p.reparto, usi: fs.increment(1), ultimo: Date.now() }, { merge: true }),
    aggiungi: v => fs.addDoc(col, { ...v, creato: fs.serverTimestamp() }),
    aggiorna: (id, campi) => fs.updateDoc(fs.doc(col, id), campi),
    togli: id => fs.deleteDoc(fs.doc(col, id)),
    ripristina: v => { const {id, ...resto} = v; return fs.setDoc(fs.doc(col, id), { ...resto, creato: fs.Timestamp.fromMillis(v.creato) }); }
  };
}

function avviaProva(){
  $("avvisoDemo").hidden = false;
  stato("", "Solo su questo telefono");
  const chiaveLista = "spesa.prova." + idLista;
  let canale = null; try { canale = new BroadcastChannel(chiaveLista) } catch {}
  const leggi = () => { try { return JSON.parse(store.get(chiaveLista) || "[]") } catch { return [] } };
  const salva = arr => { store.set(chiaveLista, JSON.stringify(arr)); voci = arr; disegna(); canale?.postMessage(1); };
  const chiaveProd = "spesa.prodotti." + idLista;
  const leggiProd = () => { try { return JSON.parse(store.get(chiaveProd) || "[]") } catch { return [] } };
  prodotti = leggiProd();
  const chiaveAcq = "spesa.acquisti." + idLista;
  const leggiAcq = () => { try { return JSON.parse(store.get(chiaveAcq) || "[]") } catch { return [] } };
  const salvaAcq = arr => {
    store.set(chiaveAcq, JSON.stringify(arr));
    acquisti = [...arr].sort((a, b) => b.il - a.il); statoAcq = "ok"; disegnaStorico(); canale?.postMessage(1);
  };
  voci = leggi(); disegna();
  if (canale) canale.onmessage = () => { voci = leggi(); prodotti = leggiProd(); acquisti = leggiAcq().sort((a, b) => b.il - a.il); disegna(); };
  return {
    registraAcquisto: async (id, a) => salvaAcq([...leggiAcq().filter(x => x.id !== id), { id, ...a }]),
    annullaAcquisto: async id => salvaAcq(leggiAcq().filter(x => x.id !== id)),
    aggiornaAcquisto: async (id, c) => salvaAcq(leggiAcq().map(x => x.id === id ? { ...x, ...c } : x)),
    ascoltaAcquisti(){ acquisti = leggiAcq().sort((a, b) => b.il - a.il); statoAcq = "ok"; recuperaAcquisti(); disegnaStorico(); },
    dimenticaProdotto: async nome => {
      const arr = leggiProd(); const es = arr.find(x => chiave(x.nome) === chiave(nome));
      if (es) { es.usi = (es.usi || 0) - 1; store.set(chiaveProd, JSON.stringify(arr)); prodotti = arr; }
    },
    registraProdotto: async p => {
      const arr = leggiProd(); const k = chiave(p.nome);
      const es = arr.find(x => chiave(x.nome) === k);
      if (es) { es.usi = (es.usi || 0) + 1; es.ultimo = Date.now(); }
      else arr.push({ nome: p.nome, em: p.em, reparto: p.reparto, usi: 1, ultimo: Date.now() });
      store.set(chiaveProd, JSON.stringify(arr)); prodotti = arr; canale?.postMessage(1);
    },
    aggiungi: async v => salva([...leggi(), { ...v, id: crypto.randomUUID?.() || String(Date.now()+Math.random()), creato: Date.now() }]),
    aggiorna: async (id, c) => salva(leggi().map(x => x.id === id ? { ...x, ...c } : x)),
    togli: async id => salva(leggi().filter(x => x.id !== id)),
    ripristina: async v => salva([...leggi(), v])
  };
}

/* ---------------- disegno ---------------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SPUNTA = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function rigaVoce(v){
  const info = v.fatto
    ? (v.fattoDa ? `preso da ${esc(v.fattoDa)}` : "preso") + (v.fattoIl ? ` · ${quando(v.fattoIl)}` : "")
    : (v.da ? `aggiunto da ${esc(v.da)}` : "");
  return `<li class="voce${v.fatto ? " fatto" : ""}" data-id="${esc(v.id)}">
    <button class="spunta" data-azione="spunta" aria-label="${v.fatto ? "Rimetti in lista" : "Segna come preso"}: ${esc(v.nome)}">${SPUNTA}</button>
    <span class="icona" aria-hidden="true">${esc(aspetto(v).em)}</span>
    <div class="corpo" data-azione="spunta"><span class="nome">${esc(separaQta(v.nome).resto)}</span>${separaQta(v.nome).qta ? `<span class="qta">${esc(separaQta(v.nome).qta)}</span>` : ""}${info ? `<span class="chi">${info}</span>` : ""}</div>
    <button class="matita" data-azione="modifica" aria-label="Modifica ${esc(v.nome)}"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z" stroke-linejoin="round"/><path d="M13.5 6.5l4 4"/></svg></button>
    <button class="togli" data-azione="togli" aria-label="Elimina ${esc(v.nome)}">×</button>
  </li>`;
}

function frequenti(){
  return prodotti
    .filter(p => (p.usi || 0) >= 1 && !giaInLista(p.nome))
    .sort((a, b) => (b.usi || 0) - (a.usi || 0) || (b.ultimo || 0) - (a.ultimo || 0))
    .slice(0, 12);
}
function disegna(){
  const daPrendere = voci.filter(v => !v.fatto).sort((a,b) => a.creato - b.creato);
  const presi = voci.filter(v => v.fatto).sort((a,b) => (b.fattoIl||0) - (a.fattoIl||0));
  let html = "";

  const freq = frequenti();
  if (freq.length){
    html += `<section class="frequenti"><h2>Compri spesso</h2><div class="chips">${
      freq.map(p => `<button class="chip" data-azione="frequente" data-k="${esc(chiave(p.nome))}"><span aria-hidden="true">${esc(p.em || emReparto(p.reparto))}</span>${esc(p.nome)}</button>`).join("")
    }</div></section>`;
  }
  if (!voci.length){
    html += `<div class="vuoto"><p>Lista vuota</p><p>Scrivi qui sotto la prima cosa che serve.</p></div>`;
  }
  for (const r of REPARTI){
    const gruppo = daPrendere.filter(v => aspetto(v).reparto === r.id);
    if (!gruppo.length) continue;
    html += `<section class="reparto"><h2><span class="em" aria-hidden="true">${r.em}</span>${r.nome}</h2><ul>${gruppo.map(rigaVoce).join("")}</ul></section>`;
  }
  if (presi.length){
    html += `<section class="reparto"><div class="carrello-testa"><h2><span class="em" aria-hidden="true">🛒</span>Nel carrello (${presi.length})</h2>
      <button class="svuota" data-azione="svuota">Svuota carrello</button></div><ul>${presi.map(rigaVoce).join("")}</ul></section>`;
  }
  $("lista").innerHTML = html;

  const n = daPrendere.length;
  $("riepilogo").innerHTML = !voci.length ? "" :
    n === 0 ? "<b>Tutto preso!</b> Puoi svuotare il carrello." :
    `<b>${n}</b> ${n === 1 ? "cosa da prendere" : "cose da prendere"}${presi.length ? `, ${presi.length} nel carrello` : ""}`;
  disegnaStorico();
}

/* ---------------- date ---------------- */
const F = o => new Intl.DateTimeFormat("it-IT", o);
const fOra = F({ hour: "2-digit", minute: "2-digit" });
const fGiorno = F({ weekday: "long", day: "numeric", month: "long" });
const fGiornoAnno = F({ weekday: "long", day: "numeric", month: "long", year: "numeric" });
const fCorto = F({ day: "numeric", month: "short" });
const fCortoAnno = F({ day: "numeric", month: "short", year: "2-digit" });
const maiusc = s => s.charAt(0).toUpperCase() + s.slice(1);
const quest_anno = ms => new Date(ms).getFullYear() === new Date().getFullYear();
function inizioGiorno(ms){ const d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); }
function giorniFa(ms){ return Math.round((inizioGiorno(Date.now()) - inizioGiorno(ms)) / 864e5); }
function giornoLungo(ms){
  const g = giorniFa(ms);
  if (g === 0) return "Oggi";
  if (g === 1) return "Ieri";
  return maiusc((quest_anno(ms) ? fGiorno : fGiornoAnno).format(ms));
}
function giornoCorto(ms){ return (quest_anno(ms) ? fCorto : fCortoAnno).format(ms).replace(".", ""); }
// "oggi 13:22", "ieri 19:05", "2 nov 18:40"
function quando(ms){
  const g = giorniFa(ms);
  return `${g === 0 ? "oggi" : g === 1 ? "ieri" : giornoCorto(ms)} ${fOra.format(ms)}`;
}
function quantoTempoFa(ms){
  const g = giorniFa(ms);
  if (g <= 0) return "oggi";
  if (g === 1) return "ieri";
  if (g < 30) return `${g} giorni fa`;
  const m = Math.floor(g / 30);
  if (m < 12) return m === 1 ? "un mese fa" : `${m} mesi fa`;
  const a = Math.floor(g / 365);
  return a <= 1 ? "un anno fa" : `${a} anni fa`;
}

/* ---------------- storico acquisti ---------------- */
function datiAcquisto(v, da, il){
  const { qta, resto } = separaQta(v.nome);
  const a = aspetto(v);
  return { nome: resto, qta, em: a.em, reparto: a.reparto, da: da || "", il };
}
// le cose già nel carrello prima di questa versione finiscono comunque nello storico
const inRecupero = new Set();
function recuperaAcquisti(){
  if (statoAcq !== "ok" || !api) return;
  const ids = new Set(acquisti.map(a => a.id));
  for (const v of voci){
    if (!v.fatto || !v.fattoIl || ids.has(v.id) || inRecupero.has(v.id)) continue;
    inRecupero.add(v.id);
    api.registraAcquisto(v.id, datiAcquisto(v, v.fattoDa, v.fattoIl)).catch(err => console.error(err));
  }
}

let storicoAperto = false;
const corrisponde = (nome, q) => {
  const n = norm(nome);
  return n.startsWith(q) || n.split(" ").some(w => w.startsWith(q)) || (q.length >= 3 && n.includes(q));
};
function disegnaStorico(){
  if (!storicoAperto) return;
  const box = $("listaStorico");
  const q = norm($("cercaStorico").value);
  $("pulisciStorico").hidden = !q;

  if (statoAcq === "carica"){ box.innerHTML = `<div class="vuoto"><p>Un attimo…</p></div>`; $("riepilogoStorico").textContent = ""; return; }
  if (statoAcq === "errore"){
    box.innerHTML = `<div class="vuoto"><p>Storico non disponibile</p><p>Non riesco a leggerlo da Firebase. Controlla le regole del database.</p></div>`;
    $("riepilogoStorico").textContent = ""; return;
  }
  if (!acquisti.length){
    $("riepilogoStorico").textContent = "";
    box.innerHTML = `<div class="vuoto"><p>Ancora niente</p><p>Quando spunti un prodotto come preso, lo trovi qui con la data.</p></div>`;
    return;
  }

  if (!q){
    const giorni = new Set(acquisti.map(a => inizioGiorno(a.il))).size;
    $("riepilogoStorico").innerHTML = `<b>${acquisti.length}</b> ${acquisti.length === 1 ? "acquisto" : "acquisti"} in ${giorni} ${giorni === 1 ? "giorno" : "giorni"} di spesa`;
    let html = "", giorno = null, n = 0;
    for (const a of acquisti){
      if (++n > 400) break;
      const g = inizioGiorno(a.il);
      if (g !== giorno){
        if (giorno !== null) html += `</ul></section>`;
        giorno = g;
        html += `<section class="reparto"><h2>${esc(giornoLungo(a.il))}</h2><ul>`;
      }
      html += `<li class="voce acq">
        <span class="icona" aria-hidden="true">${esc(a.em || emReparto(a.reparto))}</span>
        <div class="corpo"><span class="nome">${esc(a.nome)}</span>${a.qta ? `<span class="qta">${esc(a.qta)}</span>` : ""}${a.da ? `<span class="chi">preso da ${esc(a.da)}</span>` : ""}</div>
        <span class="ora">${fOra.format(a.il)}</span></li>`;
    }
    box.innerHTML = html + `</ul></section>`;
    return;
  }

  // ricerca: un riquadro per prodotto con l'ultima volta che è stato preso
  const gruppi = new Map();
  for (const a of acquisti){
    if (!corrisponde(a.nome, q)) continue;
    const k = chiave(a.nome);
    if (!gruppi.has(k)) gruppi.set(k, []);
    gruppi.get(k).push(a);   // già in ordine dal più recente
  }
  const lista = [...gruppi.values()].sort((x, y) => {
    const px = norm(x[0].nome).startsWith(q) ? 1 : 0, py = norm(y[0].nome).startsWith(q) ? 1 : 0;
    return py - px || y[0].il - x[0].il;
  });
  $("riepilogoStorico").textContent = lista.length
    ? `${lista.length} ${lista.length === 1 ? "prodotto trovato" : "prodotti trovati"}` : "";
  if (!lista.length){
    box.innerHTML = `<div class="vuoto"><p>Mai preso</p><p>Nessun acquisto di “${esc($("cercaStorico").value.trim())}” nello storico.</p></div>`;
    return;
  }
  box.innerHTML = lista.map(arr => {
    const u = arr[0];
    const gia = giaInLista(u.nome);
    const date = arr.slice(0, 12).map(a => `<span>${esc(giornoCorto(a.il))}${a.qta ? ` · ${esc(a.qta)}` : ""}</span>`).join("");
    return `<article class="sp">
      <div class="sp-testa">
        <span class="icona" aria-hidden="true">${esc(u.em || emReparto(u.reparto))}</span>
        <div class="corpo">
          <div class="sp-nome">${esc(u.nome)}</div>
          <div class="sp-ultimo">Ultima volta: <b>${esc(quantoTempoFa(u.il))}</b></div>
          <div class="sp-volte">${esc(giornoLungo(u.il))}, ${fOra.format(u.il)}${u.da ? ` · ${esc(u.da)}` : ""}${arr.length > 1 ? ` · preso ${arr.length} volte` : ""}</div>
        </div>
      </div>
      ${arr.length > 1 ? `<div class="sp-date" aria-label="Tutte le volte">${date}${arr.length > 12 ? `<span>+${arr.length - 12}</span>` : ""}</div>` : ""}
      <button class="rimetti" type="button" data-k="${esc(chiave(u.nome))}"${gia ? " disabled" : ""}>${gia ? "✓ Già in lista" : "+ Rimetti in lista"}</button>
    </article>`;
  }).join("");
}

function apriStorico(){
  if (storicoAperto) return;
  storicoAperto = true;
  document.body.classList.add("in-storico");
  $("storico").hidden = false;
  window.scrollTo(0, 0);
  history.pushState({ storico: 1 }, "");
  api?.ascoltaAcquisti();
  disegnaStorico();
}
function chiudiStorico(){
  storicoAperto = false;
  document.body.classList.remove("in-storico");
  $("storico").hidden = true;
  $("cercaStorico").value = "";
  window.scrollTo(0, 0);
}
$("apriStorico").addEventListener("click", apriStorico);
$("chiudiStorico").addEventListener("click", () => history.state?.storico ? history.back() : chiudiStorico());
window.addEventListener("popstate", () => { if (storicoAperto) chiudiStorico(); });
$("cercaStorico").addEventListener("input", disegnaStorico);
$("pulisciStorico").addEventListener("click", () => { $("cercaStorico").value = ""; disegnaStorico(); $("cercaStorico").focus(); });
$("listaStorico").addEventListener("click", e => {
  const b = e.target.closest(".rimetti");
  if (!b || b.disabled || !api) return;
  const u = acquisti.find(a => chiave(a.nome) === b.dataset.k);
  if (!u) return;
  if (navigator.vibrate) navigator.vibrate(12);
  aggiungiProdotto({ nome: u.nome, em: u.em, reparto: u.reparto }, "", false);
  avvisa(`${u.nome} rimesso in lista`);
});

/* ---------------- interazioni ---------------- */
/* proposte mentre scrivi */

function aggiornaProposte(){
  const box = $("proposte");
  const testo = $("campo").value.trim();
  const { resto } = separaQta(testo);
  const trovati = cerca(resto);
  if (!testo || !trovati.length){
    box.hidden = true; box.innerHTML = "";
    const r = testo ? indovinaReparto(resto) : null;
    $("sugg").textContent = testo ? `Prodotto nuovo: andrà in ${emReparto(r)} ${nomeReparto(r)}` : "";
    return;
  }
  $("sugg").textContent = "";
  const q = norm(resto);
  box.innerHTML = trovati.map((p, i) => {
    const gia = giaInLista(p.nome);
    const n = esc(p.nome);
    const evid = norm(p.nome).startsWith(q) ? `<b>${esc(p.nome.slice(0, q.length))}</b>${esc(p.nome.slice(q.length))}` : n;
    return `<button type="button" class="proposta${gia ? " gia" : ""}" data-i="${i}">
      <span class="pe" aria-hidden="true">${esc(p.em || emReparto(p.reparto))}</span>
      <span class="pn">${evid}</span>
      <span class="pr">${gia ? "Già in lista" : esc(nomeReparto(p.reparto))}</span></button>`;
  }).join("");
  box._trovati = trovati;
  box.hidden = false;
}
$("campo").addEventListener("input", aggiornaProposte);
$("campo").addEventListener("focus", aggiornaProposte);
$("campo").addEventListener("blur", () => setTimeout(() => { $("proposte").hidden = true; }, 150));
// tenere la tastiera aperta quando si tocca una proposta
$("proposte").addEventListener("pointerdown", e => e.preventDefault());
$("proposte").addEventListener("click", e => {
  const b = e.target.closest(".proposta");
  if (!b) return;
  const p = $("proposte")._trovati[+b.dataset.i];
  const { qta } = separaQta($("campo").value.trim());
  aggiungiProdotto(p, qta);
});

async function aggiungiProdotto(p, qta, focus = true){
  const campo = $("campo");
  if (!api) return;
  const esistente = voci.find(v => !v.fatto && chiave(separaQta(v.nome).resto) === chiave(p.nome));
  if (esistente){
    campo.value = ""; aggiornaProposte(); if (focus) campo.focus();
    if (!qta) { avvisa(`${p.nome} è già in lista`); return; }
    const nuovo = qta + " " + separaQta(esistente.nome).resto;
    try { await api.aggiorna(esistente.id, { nome: nuovo }); avvisa(`Aggiornato: ${nuovo}`); }
    catch (err) { console.error(err); }
    return;
  }
  campo.value = ""; aggiornaProposte(); if (focus) campo.focus();
  const nome = (qta ? qta + " " : "") + p.nome;
  try {
    await api.aggiungi({ nome, em: p.em || emReparto(p.reparto), reparto: p.reparto, da: mioNome, fatto: false });
    api.registraProdotto(p).catch(err => console.error(err));
  } catch (err) { avvisa("Non sono riuscito ad aggiungere. Controlla la connessione."); console.error(err); }
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const testo = $("campo").value.trim().replace(/\s+/g, " ");
  if (!testo) return;
  const { qta, resto } = separaQta(testo);
  let p = trovaEsatto(resto);
  if (!p){
    const nome = resto.charAt(0).toUpperCase() + resto.slice(1);
    const simile = riconosci(resto);
    const reparto = simile ? simile.reparto : indovinaReparto(resto);
    p = { nome, reparto, em: simile ? simile.em : emReparto(reparto) };
  }
  aggiungiProdotto(p, qta);
});

$("lista").addEventListener("click", async e => {
  const el = e.target.closest("[data-azione]");
  if (!el || !api) return;
  const azione = el.dataset.azione;

  if (azione === "frequente"){
    const p = prodotti.find(x => chiave(x.nome) === el.dataset.k);
    if (p) { if (navigator.vibrate) navigator.vibrate(12); aggiungiProdotto(p, "", false); }
    return;
  }
  if (azione === "svuota"){
    const presi = voci.filter(v => v.fatto);
    if (!presi.length) return;
    await Promise.all(presi.map(v => api.togli(v.id)));
    avvisa(`Carrello svuotato (${presi.length})`, () => Promise.all(presi.map(v => api.ripristina(v))));
    return;
  }

  const id = el.closest(".voce")?.dataset.id;
  const v = voci.find(x => x.id === id);
  if (!v) return;

  if (azione === "spunta"){
    if (navigator.vibrate) navigator.vibrate(12);
    if (v.fatto){
      await api.aggiorna(id, { fatto:false, fattoDa:"", fattoIl:0 });
      api.annullaAcquisto(id).catch(err => console.error(err));
    } else {
      const il = Date.now();
      await api.aggiorna(id, { fatto:true, fattoDa: mioNome, fattoIl: il });
      api.registraAcquisto(id, datiAcquisto(v, mioNome, il)).catch(err => console.error(err));
    }
  }
  if (azione === "modifica"){ apriModifica(v); return; }
  if (azione === "togli"){
    await api.togli(id);
    avvisa(`Eliminato: ${v.nome}`, () => api.ripristina(v));
  }
});

/* modifica di una voce */
let inModifica = null, repartoToccato = false;
$("modReparto").innerHTML = REPARTI.map(r => `<option value="${r.id}">${r.em} ${r.nome}</option>`).join("");
function apriModifica(v){
  inModifica = v; repartoToccato = false;
  const { qta, resto } = separaQta(v.nome);
  $("modNome").value = resto;
  $("modQta").value = qta;
  $("modReparto").value = aspetto(v).reparto;
  $("veloModifica").hidden = false;
  setTimeout(() => { const c = $("modNome"); c.focus(); c.setSelectionRange(c.value.length, c.value.length); }, 60);
}
function chiudiModifica(){ $("veloModifica").hidden = true; inModifica = null; }
$("modAnnulla").addEventListener("click", chiudiModifica);
$("veloModifica").addEventListener("click", e => { if (e.target.id === "veloModifica") chiudiModifica(); });
$("modReparto").addEventListener("change", () => { repartoToccato = true; });
// mentre correggi il nome, il reparto si aggiorna da solo (finché non lo scegli tu)
$("modNome").addEventListener("input", () => {
  if (repartoToccato) return;
  const p = riconosci($("modNome").value);
  if (p) $("modReparto").value = p.reparto;
});
$("formModifica").addEventListener("submit", async e => {
  e.preventDefault();
  const v = inModifica;
  if (!v || !api) return;
  const grezzo = $("modNome").value.trim().replace(/\s+/g, " ");
  if (!grezzo) return;
  const nomeNuovo = grezzo.charAt(0).toUpperCase() + grezzo.slice(1);
  const qta = $("modQta").value.trim().replace(/\s+/g, " ");
  const reparto = $("modReparto").value;
  const p = riconosci(nomeNuovo);
  const em = p && p.reparto === reparto ? p.em : (p && !repartoToccato ? p.em : emReparto(reparto));
  const vecchioNome = separaQta(v.nome).resto;
  chiudiModifica();
  try {
    await api.aggiorna(v.id, { nome: (qta ? qta + " " : "") + nomeNuovo, em, reparto });
    if (v.fatto) api.aggiornaAcquisto(v.id, { nome: nomeNuovo, qta, em, reparto }).catch(() => {});
    if (chiave(vecchioNome) !== chiave(nomeNuovo)){
      api.dimenticaProdotto(vecchioNome).catch(() => {});
      api.registraProdotto({ nome: p && chiave(p.nome) === chiave(nomeNuovo) ? p.nome : nomeNuovo, em, reparto }).catch(err => console.error(err));
    }
    avvisa("Modifica salvata");
  } catch (err) { avvisa("Non sono riuscito a salvare. Controlla la connessione."); console.error(err); }
});

/* toast con annulla */
let timerToast;
function avvisa(testo, annulla){
  const t = $("toast"), b = $("toastAnnulla");
  $("toastTesto").textContent = testo;
  b.hidden = !annulla;
  b.onclick = async () => { t.classList.remove("su"); if (annulla) await annulla(); };
  t.classList.add("su");
  clearTimeout(timerToast);
  timerToast = setTimeout(() => t.classList.remove("su"), 4000);
}

/* nome */
function aggiornaChiSono(){ $("cambiaNome").textContent = mioNome ? `Sei ${mioNome}. Cambia nome` : "Imposta il tuo nome"; }
function chiediNome(){ $("veloNome").hidden = false; $("campoNome").value = mioNome; setTimeout(() => $("campoNome").focus(), 50); }
$("cambiaNome").addEventListener("click", chiediNome);
$("formNome").addEventListener("submit", e => {
  e.preventDefault();
  const n = $("campoNome").value.trim();
  if (!n) return;
  mioNome = n.charAt(0).toUpperCase() + n.slice(1);
  store.set("spesa.nome", mioNome);
  $("veloNome").hidden = true;
  aggiornaChiSono();
});

/* avvio */
aggiornaChiSono();
if (!mioNome) chiediNome();
try {
  api = usaFirebase ? await avviaFirebase() : avviaProva();
} catch (err) {
  console.error(err);
  stato("off", "Errore Firebase");
  avvisa("Non riesco a collegarmi a Firebase: controlla la configurazione.");
}
window.addEventListener("hashchange", () => location.reload());
window.addEventListener("offline", () => stato("off", "Offline"));
